name: SonarQube Backend Analysis

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  sonarqube:
    name: SonarQube
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure .NET environment
        run: |
          echo "DOTNET_ROOT=/home/ubuntu/.dotnet" >> $GITHUB_ENV
          echo "/home/ubuntu/.dotnet" >> $GITHUB_PATH
          echo "/home/ubuntu/.dotnet/tools" >> $GITHUB_PATH

      - name: Check .NET version
        run: dotnet --version

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install or update SonarScanner
        run: dotnet tool update --global dotnet-sonarscanner

      - name: Begin SonarQube analysis
        run: |
          dotnet-sonarscanner begin \
            /k:"gamedock-backend" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

      - name: Restore dependencies
        run: dotnet restore GameDock.API/GameDock.API.csproj

      - name: Build project
        run: dotnet build GameDock.API/GameDock.API.csproj --no-restore

      - name: Run tests
        run: dotnet test GameDock.Tests/GameDock.Tests.csproj

      - name: End SonarQube analysis
        run: |
          dotnet-sonarscanner end \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}"